name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Verify package contents
        run: |
          npm pack --dry-run --json > package-dry-run.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const [pack] = JSON.parse(await readFile("package-dry-run.json", "utf8"));
          const paths = pack.files.map((file) => file.path);
          const unwanted = paths.filter((path) =>
            path.startsWith("src/") || path.startsWith("test/") || path.startsWith(".pi/")
          );
          if (unwanted.length > 0) throw new Error(`Unexpected package files: ${unwanted.join(", ")}`);
          if (!paths.some((path) => path.startsWith("drizzle/"))) {
            throw new Error("Package does not contain database migrations");
          }
          NODE
