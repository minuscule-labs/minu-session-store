name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const expected = process.argv[1]; const actual = require("./package.json").version; if (actual !== expected) throw new Error(`Tag ${expected} does not match package ${actual}`)' "$VERSION"
      - run: npm ci
      - run: npm run verify
      - name: Build release artifact
        run: |
          mkdir release
          npm pack --pack-destination release
          (cd release && sha256sum *.tgz > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.tgz release/SHA256SUMS \
            --verify-tag \
            --title "MinuSessionStore $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
